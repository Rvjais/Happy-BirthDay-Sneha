  <style>
    :root {
      --neon-pink: #ff69b4;
      --deep-bg: rgba(10, 14, 42, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-image: url('img2.png');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-color: #050827;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px 100px;
    }
    h1 {
      font-size: 2rem;
      text-shadow: 0 0 10px var(--neon-pink);
      margin-bottom: 20px;
      text-align: center;
    }
    .masonry {
      column-count: 2; /* Mobile first: 2 columns */
      column-gap: 10px;
      width: 100%;
      max-width: 1200px;
    }
    @media (min-width: 768px) {
      .masonry {
        column-count: 3;
        column-gap: 15px;
      }
    }
    @media (min-width: 1024px) {
      .masonry {
        column-count: 4;
      }
    }
    .item {
      margin-bottom: 10px;
      display: inline-block;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
      transition: transform 0.2s ease-in-out;
      background: rgba(0,0,0,0.3);
      position: relative;
    }
    .item:active { transform: scale(0.96); }
    .item img, .item video {
      width: 100%;
      display: block;
    }
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      pointer-events: none;
      opacity: 0.8;
      text-shadow: 0 0 10px #000;
    }
    
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 10000; /* Higher than navbar */
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .lightbox.active { display: flex; }
    .lightbox-content {
      max-width: 95%;
      max-height: 85%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255,105,180,0.5);
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: #ff69b4; font-size: 35px; cursor: pointer;
      z-index: 10001;
      padding: 10px;
    }
  </style>
</head>

  <script>
    function openLightbox(element, src, type) {
      const container = document.getElementById('lightbox-container');
      container.innerHTML = '';
      if(type === 'image') {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'lightbox-content';
        // Prevent closing when clicking the image itself
        img.onclick = function(e) { e.stopPropagation(); }; 
        container.appendChild(img);
      } else if (type === 'video') {
        const vid = document.createElement('video');
        vid.src = src;
        vid.controls = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.className = 'lightbox-content';
        vid.onclick = function(e) { e.stopPropagation(); };
        container.appendChild(vid);
      }
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightbox-container').innerHTML = '';
    }
  </script>
